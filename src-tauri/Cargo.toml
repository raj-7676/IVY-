[package]
name = "app"
version = "0.1.4"
description = "Ivy - offline voice dictation"
authors = ["Yash"]
license = "MIT"
repository = "https://github.com/raj-7676/IVY-"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
arboard = "3"
enigo = "0.2"
chrono = "0.4"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_Graphics_Dxgi",
  "Win32_System_Power",
  "Win32_System_Performance",
  "Win32_UI_Shell",
  "Win32_Graphics_Dwm",
] }

# Real multimodal STT & cleanup (Voxtral Mini 3B via llama.cpp mtmd) and fallback
# STT (Whisper large-v3-turbo ONNX) — see src/voxtral.rs, src/stt.rs, src/audio.rs.
# Whisper-compatible log-mel spectrogram frontend (real, published crate —
# matches whisper.cpp/pytorch/librosa reference output; avoids hand-rolling
# STFT + mel filterbank code).
cpal = "0.18"
rubato = "0.16"
llama-cpp-2 = { version = "0.1.156", features = ["vulkan", "mtmd"] }
llama-cpp-sys-2 = { version = "0.1.156", features = ["vulkan", "mtmd"] }
hound = "3"

# Vendored copy of llama-cpp-sys-2 0.1.156 with one fix: llama.cpp avg-pools Voxtral's audio encoder output
# (187 tokens per 30 s) but the real model does not (375). See "IVY PATCH" in
# vendor/llama-cpp-sys-2/llama.cpp/tools/mtmd/clip-model.h. Drop this once upstream fixes it.
[patch.crates-io]
llama-cpp-sys-2 = { path = "vendor/llama-cpp-sys-2" }
