version: 2
# Monthly, one grouped pull request per area (at most 3 a month). Security alerts are separate and stay on.
updates:
  # Maintain Rust dependencies in src-tauri
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    groups:
      rust:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "security"
      - "rust"

  # Maintain npm frontend dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    groups:
      frontend:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "security"
      - "frontend"

  # Maintain GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "ci"
